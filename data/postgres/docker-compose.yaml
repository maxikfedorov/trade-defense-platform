version: "3.8"

services:
  db:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: excel_to_pg
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: appdb
      PGUSER: appuser
      PGPASSWORD: apppass
      EXCEL_PATH: /data/postgres/input.xlsx
      TABLE_NAME: public.tariffs
    volumes:
      - ./:/data/postgres:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-u", "/app/import_excel.py"]
