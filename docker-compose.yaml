version: "3.8"

services:
  db:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.backend
    image: trade-defense-backend:0.1.0
    container_name: trade-defense-backend
    environment:
      - AI_BASEURL=http://host.docker.internal:8000
      - SERVER_PORT=8080
    ports:
      - "8080:8080"

volumes:
  qdrant_data:
    driver: local
  mongo_data:
    driver: local

